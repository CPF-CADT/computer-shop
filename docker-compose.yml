services:
  server:
    build:
      context: ./server
    env_file:
      - path: ./server/.env
        format: raw
    environment:
      PORT: 3000
      DB_SYNC: "true"
    ports:
      - "3002:3000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:3002/api/
    depends_on:
      - server
    ports:
      - "5173:80"
    restart: unless-stopped
